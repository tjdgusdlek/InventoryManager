<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 당근 아이콘을 파비콘(웹 브라우저 탭 아이콘)으로 사용 -->
    <link rel="icon" type="image/png" href="/icon.png" />
    
    <!-- 모바일 화면 확대/축소 방지 및 앱 화면처럼 꽉 차게 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- ✨ 브라우저 탭에 표시되는 웹사이트 이름 ✨ -->
    <title>당근 재고관리 시스템</title>

    <!-- 스마트폰 바탕화면 설치(PWA)를 위한 추가 태그 -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 웹 브라우저 주소창과 폰 상단 상태바 색상을 당근색(주황색)으로 변경 -->
    <meta name="theme-color" content="#f97316" />
    
    <!-- 아이폰(iOS) 바탕화면 설치를 위한 필수 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ✨ 아이폰 바탕화면에 설치될 때의 앱 이름 ✨ -->
    <meta name="apple-mobile-web-app-title" content="당근 재고" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
