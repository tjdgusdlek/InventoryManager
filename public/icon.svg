<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 흰색 둥근 사각형 배경 -->
  <rect width="512" height="512" rx="115" fill="#ffffff"/>
  
  <!-- 당근 그룹 (가운데 정렬 및 25도 회전하여 역동적인 느낌 추가) -->
  <g transform="translate(256, 260) rotate(25)">
    
    <!-- 🌿 잎사귀 부분 (당근 몸통 뒤에 렌더링되도록 먼저 작성) -->
    <!-- 가운데 잎 -->
    <path d="M 0 -70 C -20 -160 -40 -200 -40 -200 C 40 -220 50 -130 0 -70 Z" fill="#22c55e" />
    <!-- 왼쪽 잎 -->
    <path d="M -20 -60 C -80 -130 -120 -130 -120 -130 C -120 -70 -60 -30 -20 -60 Z" fill="#4ade80" />
    <!-- 오른쪽 잎 -->
    <path d="M 20 -60 C 80 -130 120 -130 120 -130 C 120 -70 60 -30 20 -60 Z" fill="#4ade80" />
    
    <!-- 🥕 당근 몸통 (통통하고 둥근 형태) -->
    <path d="M -70 -40 C -70 -110, 70 -110, 70 -40 C 70 70, 25 170, 0 190 C -25 170, -70 70, -70 -40 Z" fill="#f97316" />
    
    <!-- 당근 무늬 (주름 디테일) -->
    <path d="M -50 0 Q 0 20 40 -10" stroke="#ea580c" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M -40 60 Q -10 80 30 50" stroke="#ea580c" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M -20 120 Q 5 135 20 110" stroke="#ea580c" stroke-width="10" stroke-linecap="round" fill="none" />
    
    <!-- 당근 윤기 (왼쪽 상단 빛 반사 하이라이트) -->
    <path d="M -40 -30 C -40 -60, -10 -80, 10 -80" stroke="#fdba74" stroke-width="10" stroke-linecap="round" fill="none" />
  </g>
</svg>